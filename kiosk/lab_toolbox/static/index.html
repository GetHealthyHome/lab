<!doctype html>
<!-- Kiosk screen for the 7" touchscreen (800x480) in Chromium kiosk mode. One lean page, no libraries: it only talks to /api.
     Logo: static/lab-logo.png (the Lab Toolbox logo) unless a static/logo.png override exists; big on the start screen, small in every header. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Toolbox</title>
<style>
/* Look from Ande's mockups (Nov 10): graphite dark by default, Apple-style light via screen_theme. Fonts ship in static/fonts (SIL OFL), so no internet is needed. */
@font-face { font-family:"Hanken Grotesk"; src:url(/static/fonts/hanken-grotesk.woff2) format("woff2"); font-weight:100 900; }
@font-face { font-family:"JetBrains Mono"; src:url(/static/fonts/jetbrains-mono.woff2) format("woff2"); font-weight:100 800; }
:root { --bg:#131315; --panel:#1c1c1e; --raised:#2c2c2e; --line:rgba(255,255,255,.12); --text:#f2f2f7; --muted:#a1a1aa;
        --blue:#0a84ff; --on-blue:#fff; --green:#30d158; --on-green:#000; --red:#ff453a; --on-red:#fff; --amber:#ff9f0a; --on-amber:#000;
        --tap:80px; /* 15 mm on the official 7" screen (about 5.2 px per mm) */
        --mono:"JetBrains Mono", "DejaVu Sans Mono", monospace; --glow:0 0 22px; }
/* Light look, picked by screen_theme on the dashboard's Settings page. Darker green/red keep white text readable. */
:root[data-theme="light"] { --bg:#f5f5f7; --panel:#ffffff; --raised:#e5e5ea; --line:#d1d1d6; --text:#1d1d1f; --muted:#6e6e73;
        --blue:#0071e3; --green:#248a3d; --on-green:#fff; --red:#d70015; --amber:#b25900; --on-amber:#fff; --glow:0 2px 10px; }
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
html, body { height:100%; background:var(--bg); color:var(--text); font:500 24px/1.25 "Hanken Grotesk", system-ui, "DejaVu Sans", sans-serif;
             overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; cursor:none; }
#app { position:fixed; inset:0; display:flex; flex-direction:column; }
#app::after { content:""; position:absolute; inset:0; pointer-events:none; border:10px solid transparent; border-radius:6px; transition:border-color .15s; }
#app.f-ok::after { border-color:var(--green); } #app.f-bad::after { border-color:var(--red); } #app.f-warn::after { border-color:var(--amber); }
#app.f-bad { animation:shake .3s; }
@keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
header { height:56px; flex:none; display:flex; align-items:center; gap:12px; margin:8px 12px 0; padding:0 8px 0 6px; background:var(--panel); border:1px solid var(--line); border-radius:16px; }
header img { height:42px; width:42px; object-fit:contain; background:#fff; border-radius:10px; padding:2px; }  /* white tile: the logo's black lettering must show on the dark look */
header .t { flex:1; font-size:23px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pill { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:18px; background:var(--raised); font:600 18px var(--mono); white-space:nowrap; }
.pill::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--green); }
.pill.off { color:var(--red); } .pill.off::before { background:var(--red); }
.clock::before { display:none; }
main { flex:1; min-height:0; padding:12px; display:flex; flex-direction:column; gap:12px; }
button { font:inherit; font-weight:700; letter-spacing:-.01em; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:20px;
         min-height:var(--tap); min-width:var(--tap); padding:6px 16px; transition:transform .08s, filter .08s; }
button:active { filter:brightness(1.18); transform:scale(.97); }
button.blue { background:var(--blue); color:var(--on-blue); } button.green { background:var(--green); color:var(--on-green); }
button.red { background:var(--red); color:var(--on-red); } button.amber { background:var(--amber); color:var(--on-amber); }
button.blue, button.green, button.red, button.amber { border-color:transparent; box-shadow:0 4px 14px rgba(0,0,0,.25); }
button.on { outline:4px solid var(--text); outline-offset:3px; }
button.ghost { background:transparent; border-color:transparent; color:var(--muted); }
button.sm { min-height:64px; font-size:21px; border-radius:16px; }
h1 { font-size:36px; font-weight:800; letter-spacing:-.02em; } h2 { font-size:27px; font-weight:700; letter-spacing:-.01em; }
.muted { color:var(--muted); } .small { font-size:19px; } .mono { font-family:var(--mono); }
.row { display:flex; gap:12px; } .col { display:flex; flex-direction:column; gap:12px; } .grow { flex:1; min-width:0; min-height:0; }
.scroll { overflow-y:auto; overscroll-behavior:contain; }
/* message bar: tinted card with a round colored badge */
.msg { --c:var(--blue); flex:none; min-height:60px; display:flex; align-items:center; gap:14px; padding:8px 16px 8px 10px; border-radius:16px; font-size:24px; font-weight:700;
       background:color-mix(in srgb, var(--c) 14%, var(--panel)); border:1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.msg.ok { --c:var(--green); } .msg.bad { --c:var(--red); } .msg.warn { --c:var(--amber); }
.msg i { flex:none; font-style:normal; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:26px; font-weight:800;
         background:var(--c); color:#fff; box-shadow:var(--glow) color-mix(in srgb, var(--c) 45%, transparent); }
.msg.ok i, .msg.warn i { color:var(--on-green); }
/* start screen */
.idle { flex:1; display:flex; gap:22px; padding:6px 10px 10px; min-height:0; }
.idle .brand { width:290px; display:flex; align-items:center; justify-content:center; }
.idle .brand img { width:270px; height:330px; object-fit:contain; background:#fff; border-radius:28px; padding:16px; box-shadow:0 8px 30px rgba(0,0,0,.3); }
.idle .prompt { font-size:28px; font-weight:700; letter-spacing:-.01em; min-height:72px; display:flex; align-items:center; }
.idle .mode { flex:1; font-size:36px; min-height:100px; border-radius:24px; }
/* session */
.items { display:flex; flex-direction:column; gap:8px; }
.items li { list-style:none; display:flex; align-items:center; gap:12px; min-height:var(--tap); padding:6px 6px 6px 14px; background:var(--panel); border:1px solid var(--line); border-radius:16px; }
.items li:first-child { animation:slide .35s ease-out; }
@keyframes slide { from { transform:translateX(-40px); opacity:0; } }
.items .n { font-size:25px; font-weight:700; } .items .d { font-size:17px; color:var(--muted); font-family:var(--mono); }
.card { --c:var(--amber); border:2px solid var(--c); border-radius:16px; padding:10px 14px; background:color-mix(in srgb, var(--c) 12%, var(--panel)); }
.card.blue { --c:var(--blue); } .card.green { --c:var(--green); }
.chips { display:flex; flex-wrap:wrap; gap:10px; }
.bar { flex:none; height:32px; border-radius:16px; background:var(--raised); position:relative; overflow:hidden; }
.bar div { position:absolute; inset:0 auto 0 0; background:var(--green); opacity:.85; transition:width 1s linear; }
.bar div.low { background:var(--amber); }
.bar span { position:absolute; inset:0; text-align:center; font:700 17px/32px var(--mono); color:var(--text); }
.side { width:236px; flex:none; }
.side .done { flex:1; font-size:38px; border-radius:24px; }
/* PIN pad: round keys like a phone */
.pad { display:grid; grid-template-columns:repeat(3, 80px); gap:8px 16px; align-content:center; }
.pad button { font-size:34px; border-radius:50%; height:80px; padding:0; background:var(--raised); }
.pad button.red { border-radius:50%; background:transparent; color:var(--red); border:1px solid var(--line); box-shadow:none; }
.dots { display:inline-flex; align-self:flex-start; gap:22px; padding:16px 26px; border-radius:40px; background:var(--panel); border:1px solid var(--line); }
.dots b { width:26px; height:26px; border-radius:50%; background:var(--raised); transition:all .15s; }
.dots b.f { background:var(--blue); transform:scale(1.15); box-shadow:var(--glow) color-mix(in srgb, var(--blue) 60%, transparent); }
/* summary: big check, then cards */
.badge { width:64px; height:64px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:38px; font-weight:800; background:var(--green); color:var(--on-green);
         box-shadow:0 0 0 10px color-mix(in srgb, var(--green) 22%, transparent), var(--glow) color-mix(in srgb, var(--green) 50%, transparent); }
.tile { display:flex; align-items:center; gap:14px; padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:16px; }
.tile .k { font:700 14px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.tile .v { font-size:24px; font-weight:700; }
.tile.due { border:2px solid var(--amber); background:color-mix(in srgb, var(--amber) 12%, var(--panel)); } .tile.due .k { color:var(--amber); }
.tile .where { font:800 28px var(--mono); color:var(--green); letter-spacing:.02em; }
.thumb { width:64px; height:64px; object-fit:cover; border-radius:12px; flex:none; background:#fff; }
.tile .thumb { width:96px; height:96px; }
.lock { flex:1; border-radius:24px; border:2px solid var(--red); background:color-mix(in srgb, var(--red) 18%, var(--bg));
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:12px; }
.lock .big { font:800 60px var(--mono); color:var(--red); }
/* on-screen keyboard (instructor and report screens only; normal checkouts never type) */
.kb { display:grid; grid-template-columns:repeat(10, 1fr); gap:6px; flex:none; }
.kb button { min-height:54px; min-width:0; padding:0; font-size:25px; border-radius:12px; background:var(--raised); }
.kb .w2 { grid-column:span 2; }
.field { flex:1; min-height:56px; display:flex; align-items:center; padding:0 16px; border:2px solid var(--blue); border-radius:14px; background:var(--panel); font:600 26px var(--mono); }
.field:empty::before { content:attr(data-ph); color:var(--muted); font-family:"Hanken Grotesk", sans-serif; }
.list-btn { width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.overdue { color:var(--red); }
</style>
</head>
<body>
<div id="app"><header id="hdr"><img id="hlogo" alt="Lab logo"><div class="t" id="htitle"></div><div class="pill clock" id="clock"></div><div class="pill" id="net">ONLINE</div></header>
<main id="main"></main></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const time = iso => { const d = new Date(iso), today = d.toDateString() === new Date().toDateString();
  return (today ? "" : d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}) + ", ") + d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); };
const where = label => label ? label.toUpperCase().replace(/\s*,\s*/g, " — ") : "ASK AN INSTRUCTOR";
const KEYS = "1234567890QWERTYUIOPASDFGHJKL-ZXCVBNM".split("");
const TAGS = ["Cracked", "Broken part", "Won't power on", "Frayed cord", "Missing piece", "Dull or worn", "Leaking", "Bent"];
const PIN_LEN = 6;  // students have 4 digits and tap ✓; staff have 6, which sends it straight away
const NOTES = ["Inspected, no damage", "Repaired", "Damage is cosmetic only"];

let photos = {};  // asset_id -> version, for tools with a photo on this Pi
const thumb = (id, style = "") => photos[id] ? `<img class="thumb" style="${style}" src="/api/tools/${encodeURIComponent(id)}/photo?v=${photos[id]}" alt="">` : "";
const loadPhotos = () => call("GET", "/api/photos").then(p => { photos = p; render(); }).catch(() => {});
let st = null, lastSeq = null, lastHtml = "", flashTimer, lastTap = Date.now(), logo = "/static/lab-logo.png";
const ui = { pin: "", pad: null, msg: null, summary: null, locked: null, report: null, inst: null, seenSaved: undefined, cancelArm: 0 };
// A logo.png dropped on the Pi (/data/logo.png) wins over the logo shipped in the repo.
const probe = new Image(); probe.onload = () => { logo = probe.src; lastHtml = ""; render(); }; probe.src = "/static/logo.png";

// ---------- talking to the kiosk service ----------
async function call(method, url, body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)});
  let data = {}; try { data = await r.json(); } catch {}
  if (!r.ok) { const e = {ok: false, kind: data.kind || "rejected", text: data.reason || "That didn't work. Try again.", ...data};
    feedback(e); throw e; }
  return data;
}
// Run a button's action; refusals are already on screen, so just refresh.
const go = fn => Promise.resolve().then(fn).catch(() => {}).finally(poll);

async function poll() {
  try { st = await call("GET", "/api/session"); net(true); }
  catch { net(false); return tick(); }
  const ev = st.last_event;
  document.documentElement.dataset.theme = st.theme;
  if (lastSeq === null) lastSeq = ev ? ev.seq : 0;  // don't replay an old scan after a reload
  else if (ev && ev.seq !== lastSeq) { lastSeq = ev.seq; feedback(ev); }
  const saved = st.auto_saved;  // the 45 s timer saved a walked-away session: still show its summary
  if (ui.seenSaved === undefined) ui.seenSaved = saved?.session_id ?? null;
  else if (saved && saved.session_id !== ui.seenSaved) { ui.seenSaved = saved.session_id; if (saved.items.length) showSummary(saved); }
  if (st.session) { ui.summary = null; ui.locked = null; }
  if (!st.session && !st.instructor) ui.inst = null;
  render(); tick();
}

const net = up => { $("net").className = up ? "pill" : "pill off"; $("net").textContent = up ? "ONLINE" : "KIOSK SERVICE DOWN"; };

// ---------- feedback: color + words on screen; the Pi's buzzer plays the sound ----------
function feedback(ev) {
  const kind = ev.ok ? "ok" : ev.kind === "wrong_battery" ? "warn" : "bad";
  ui.msg = {kind, text: ev.text || ev.reason, ev, at: Date.now()};
  if (!ev.ok) ui.pin = "";
  if (ev.kind === "locked") ui.locked = {until: ev.until, text: ev.text || ev.reason, at: Date.now()};
  flash(kind);
}
function flash(kind) {
  const app = $("app"); app.className = ""; void app.offsetWidth; app.className = "f-" + kind;
  clearTimeout(flashTimer);
  if (kind !== "warn") flashTimer = setTimeout(() => app.className = "", kind === "bad" ? 1000 : 1200);
}
const say = (text, kind = "ok") => { ui.msg = {kind, text, at: Date.now()}; flash(kind); render(); };
const msgBar = hint => {
  const m = ui.msg && Date.now() - ui.msg.at < 30000 ? ui.msg : null;
  if (!m) return `<div class="msg"><i>›</i><span>${esc(hint)}</span></div>`;
  const ev = m.ev || {};
  if (ev.kind === "wrong_battery")  // required and scanned battery side by side
    return `<div class="msg warn"><i>!</i><div class="grow">Wrong battery<div class="row small"><span class="grow">Needs: <b>${esc(ev.required)}</b></span><span class="grow">You scanned: <b>${esc(ev.scanned)}</b></span></div></div></div>`;
  return `<div class="msg ${m.kind}"><i>${m.kind === "ok" ? "✓" : m.kind === "warn" ? "!" : "✕"}</i><span>${esc(m.text)}</span></div>`;
};

// ---------- screens ----------
function view() {
  const s = st?.session;
  if (ui.locked) return lockedView();
  if (ui.summary) return summaryView();
  if (ui.pad === "instructor") return pinView("Instructor PIN", "Instructor: enter your 6-digit PIN");
  if (ui.pad && !s) return pinView(ui.pad === "in" ? "Return" : "Check out", "Enter your PIN, then tap ✓");
  if (ui.report) return reportView(s);
  if (ui.inst && st?.instructor) return instPage();
  if (s) return sessionView(s);
  if (st?.instructor) return instHome();
  return idleView();
}

function idleView() {
  const next = st?.next_action || "out";
  const recent = ui.msg && Date.now() - ui.msg.at < 8000;
  return [null, `<div class="idle">
    <div class="brand"><img src="${logo}" alt="Lab Toolbox"></div>
    <div class="col grow">
      ${recent ? msgBar("") : `<div class="prompt">Tap Check out or Return, then enter your PIN</div>`}
      <button class="mode blue ${next === "out" ? "on" : ""}" data-act="mode" data-arg="out">Check out</button>
      <button class="mode green ${next === "in" ? "on" : ""}" data-act="mode" data-arg="in">Return</button>
      <div class="row"><button class="grow sm" data-act="report">⚠ Report a problem</button><button class="sm" data-act="mode" data-arg="instructor">Instructor</button></div>
    </div></div>`];
}

function pinView(title, hint) {
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "✓"];
  const n = ui.pad === "instructor" ? 6 : Math.max(4, ui.pin.length);  // 4 dots, 6 once a staff PIN runs past 4
  return [title, `<div class="row grow">
    <div class="col grow" style="justify-content:center;gap:22px">
      ${msgBar(hint)}
      <div class="dots">${[...Array(n).keys()].map(i => `<b class="${i < ui.pin.length ? "f" : ""}"></b>`).join("")}</div>
      <p class="muted small">Hide the keypad with your other hand. Ask an instructor if you forgot your PIN.</p>
      <button class="sm red" style="align-self:flex-start;min-width:160px" data-act="pin" data-arg="Cancel">Cancel</button>
    </div>
    <div class="pad">${keys.map(k => `<button class="${k === "✓" ? "green" : ""}" aria-label="${k === "⌫" ? "Delete" : k === "✓" ? "Enter" : k}" data-act="pin" data-arg="${k}">${k}</button>`).join("")}</div>
  </div>`];
}

function sessionView(s) {
  const out = s.action === "out", items = [...s.items].reverse();
  const cards = [];
  for (const i of s.items.filter(i => i.needs_battery && !i.battery)) {
    const opt = s.battery_options?.[i.asset_id] || {available: []};
    cards.push(`<div class="card"><b>${esc(i.name)} needs a battery.</b> Scan a ${esc(opt.group)} battery.
      <div class="small muted">${opt.available.length ? "Charged: " + opt.available.slice(0, 3).map(b => `${esc(b.name)} at ${esc(b.spot || "?")}`).join(" · ") : "None free right now. Remove the tool or ask an instructor."}</div></div>`);
  }
  for (const k of s.kits || []) {
    if (!out && !k.confirmed) {
      const miss = ui.kitMissing?.[k.kit_id] || [];
      cards.push(`<div class="card blue"><b>${esc(k.name)}:</b> ${k.mode === "verified" ? "scan each piece, then confirm." : "tap any piece that is NOT back, then confirm."}
        <div class="chips" style="margin-top:8px">${k.waiting.map(p => k.mode === "verified" ? `<span class="small muted">${esc(p.name)}</span>`
          : `<button class="sm ${miss.includes(p.asset_id) ? "red" : "green"}" data-act="kitpiece" data-arg="${esc(k.kit_id)}|${esc(p.asset_id)}">${miss.includes(p.asset_id) ? "✕ Missing" : "✓"} ${esc(p.name)}</button>`).join("")}
        <button class="sm blue" data-act="kitok" data-arg="${esc(k.kit_id)}">Confirm pieces${k.mode === "verified" && k.waiting.length ? ` (${k.waiting.length} not back)` : ""}</button></div></div>`);
    } else if (out && k.mode === "verified" && k.waiting.length)
      cards.push(`<div class="card blue"><b>${esc(k.name)}:</b> scan every piece. Still to scan: ${k.waiting.map(p => esc(p.name)).join(", ")}</div>`);
  }
  const title = `${out ? "Checking out" : "Returning"} · ${s.person}${s.started_by ? ` (started by ${s.started_by})` : ""}`;
  return [title, `<div class="row grow">
    <div class="col grow">
      ${msgBar(st.qr ? "Hold the tool's QR label up to the camera" : out ? "Tap each tool's sticker on the reader" : "Tap each tool you're returning on the reader")}
      <div class="col grow scroll">${cards.join("")}
        <ul class="items">${items.length ? items.map(i => `<li>${thumb(i.asset_id)}<div class="grow"><div class="n">${esc(i.name)}</div>
          <div class="d">${esc(i.asset_id)}${i.kit_id ? " · kit" : ""}${i.battery ? " · battery " + esc(i.battery) : ""}${i.needs_battery && !i.battery ? " · <span style='color:var(--amber)'>needs a battery</span>" : ""}</div></div>
          <button class="ghost" aria-label="Remove ${esc(i.name)}" data-act="remove" data-arg="${esc(i.asset_id)}">✕</button></li>`).join("")
          : `<li class="muted" style="animation:none">No tools yet</li>`}</ul></div>
    </div>
    <div class="col side">
      <button class="done green" data-act="done">Done ✓<div class="small">${s.items.length} tool${s.items.length === 1 ? "" : "s"}</div></button>
      ${st.instructor ? `<button class="sm blue" data-act="asset">Type asset #</button>` : ""}
      ${st.qr ? "" : `<button class="sm" data-act="qr">Scan QR code instead</button>`}
      <div class="row"><button class="sm grow" data-act="report">⚠ Report</button>${st.instructor ? "" : `<button class="sm" data-act="mode" data-arg="instructor">Instructor</button>`}</div>
      <button class="sm ${ui.cancelArm > Date.now() ? "red" : ""}" data-act="cancel">${ui.cancelArm > Date.now() ? "Tap again to cancel" : "Cancel"}</button>
    </div></div>
    <div class="bar"><div id="fill"></div><span id="secs"></span></div>`];
}

function summaryView() {
  const r = ui.summary, out = r.action === "out", n = r.items.length;
  const short = (r.kits_short || []).map(k => `<div class="card"><b>${esc(k.name)}</b> came back without ${esc(k.missing.join(", "))}. An instructor has been told.</div>`).join("");
  const head = `<div class="row" style="align-items:center;gap:22px;padding:4px 6px"><div class="badge">✓</div><div class="grow">
      <h1>${out ? `${n} tool${n === 1 ? "" : "s"} checked out` : "Returned. Put each tool back here:"}</h1>
      <div class="muted small">${out ? `Saved for ${esc(r.person)}.` : `Thanks, ${esc(r.person)}.`}</div></div></div>`;
  const body = out
    ? `${r.due_at ? `<div class="tile due"><div class="badge" style="width:44px;height:44px;font-size:24px;background:var(--amber);box-shadow:none;color:var(--on-amber)">⏱</div>
         <div><div class="k">Return by</div><div class="v mono">${esc(time(r.due_at))}</div></div></div>` : ""}
       <div class="grow scroll col" style="gap:8px">${r.items.map(i => `<div class="tile">${thumb(i.asset_id, "width:52px;height:52px")}<div><div class="v">${esc(i.name)}</div><div class="k">${esc(i.asset_id)}</div></div></div>`).join("")}</div>`
    : `<div class="grow scroll col" style="gap:8px">${short}${r.items.map(i => `<div class="tile">${thumb(i.asset_id)}<div class="grow"><div class="v">${esc(i.name)}</div>
         <div class="k" style="margin-top:4px">Return to</div><div class="where">${esc(where(i.return_to))}</div></div></div>`).join("")}</div>`;
  return [out ? "Checkout saved" : "Return saved", `${head}${body}<button class="green" data-act="closesum">Done <span class="small mono" id="sumleft"></span></button>`];
}

function lockedView() {
  return [null, `<div class="lock"><div class="badge" style="background:var(--red);color:#fff;box-shadow:0 0 0 10px color-mix(in srgb, var(--red) 25%, transparent)">✕</div><h1>Keypad locked</h1><div>${esc(ui.locked.text)}</div>
    <div class="big" id="lockleft"></div><div class="small">Ask an instructor if you need a tool now.</div>
    <button class="sm" style="min-width:200px" data-act="closelock">OK</button></div>`];
}

// Report a problem (K8, K14, K15): from any screen, no typing needed when the tool is in your list.
function reportView(s) {
  const r = ui.report, back = `<button class="sm" data-act="${r.step === "type" ? "closereport" : "rback"}">‹ Back</button>`;
  if (r.step === "type") return ["Report a problem", `<div class="row">${back}<h2 class="grow" style="align-self:center">What's wrong?</h2></div>
    <button class="grow red" data-act="rtype" data-arg="damage">Damaged tool</button>
    <button class="grow amber" data-act="rtype" data-arg="spot">Tool not in its spot</button>
    <button class="grow" data-act="rtype" data-arg="label">Worn or unreadable label</button>`];
  if (r.step === "tool") {
    const mine = (s?.items || []).map(i => ({asset_id: i.asset_id, name: i.name}));
    return ["Which tool?", picker(back, "Type the tool's name or number", mine.length && !r.q ? mine : r.results,
      t => `<button class="grow list-btn sm" data-act="rtool" data-arg="${esc(t.asset_id)}"><span>${esc(t.name)}</span><span class="small muted">${esc(t.asset_id)}</span></button>`)];
  }
  const t = esc(r.tool.name);
  if (r.kind === "label") return [`Worn label · ${r.tool.name}`, `<div class="row">${back}<h2 class="grow" style="align-self:center">How does the label look?</h2></div>
    <div class="row grow">${["Faded", "Scratched", "Peeling", "Torn"].map(c => `<button class="grow" data-act="rlabel" data-arg="${c}">${c}</button>`).join("")}</div>
    <p class="muted small">It goes on the reprint list. You can keep using the tool.</p>`];
  if (r.kind === "spot") return [`Not in its spot · ${r.tool.name}`, `<div class="row">${back}</div>
    <h2 class="grow" style="display:flex;align-items:center">${t} isn't where it belongs. Send this to the instructors?</h2>
    <button class="amber" data-act="rsend">Send report</button>`];
  const sev = [["minor", "Minor", ""], ["needs_inspection", "Needs inspection", "amber"], ["safety_hazard", "Safety hazard", "red"]];
  return [`Damaged · ${r.tool.name}`, `<div class="row">${back}${sev.map(([v, l, c]) => `<button class="grow sm ${c} ${r.severity === v ? "on" : ""}" data-act="rsev" data-arg="${v}">${l}</button>`).join("")}</div>
    <div class="chips">${TAGS.map(g => `<button class="sm ${r.tags.includes(g) ? "blue" : ""}" data-act="rtag" data-arg="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div class="row" style="margin-top:auto;align-items:center"><div class="grow small">${r.severity && r.severity !== "minor" ? "The tool will be locked until an instructor checks it. " : ""}Hold the damage up to the camera, then tap Send.</div>
    <button class="red" data-act="rsend" ${r.severity ? "" : "disabled style='opacity:.4'"}>Send 📷</button></div>`];
}

// Instructor mode (K7, K14, K16, K17)
function instHome() {
  return [`Instructor · ${st.instructor}`, `${msgBar("Pick a job")}
    <div class="row grow"><button class="grow blue" data-act="ipage" data-arg="start">Start for a student<div class="small">Forgot their PIN</div></button>
      <button class="grow" data-act="ipage" data-arg="givepin">Give a PIN</button>
      <button class="grow" data-act="ipage" data-arg="photo">📷 Tool photos &amp; NFC stickers</button></div>
    <div class="row grow"><button class="grow" data-act="ipage" data-arg="loans">Loans &amp; due times</button>
      <button class="grow amber" data-act="ipage" data-arg="quarantine">Release a locked tool</button>
      <button class="grow red" data-act="logout">Log out</button></div>
    ${st.link_for ? `<div class="card blue">Tap the new sticker on the ${esc(st.link_for)} on the reader now.</div>` : ""}`];
}

function instPage() {
  const p = ui.inst, back = `<button class="sm" data-act="iback">‹ Back</button>`;
  if (p.page === "asset") return ["Type the engraved asset number", picker(back, "Asset number, like HHA-0001", null, null,
    `<button class="sm green" data-act="iasset">Add</button>`)];
  if (p.page === "givepin" && p.given) return [`New PIN · ${p.given.name}`, `<div class="row">${back}</div>
    <div class="col grow" style="justify-content:center;align-items:center;gap:16px"><div class="big mono" style="font-size:72px;letter-spacing:.2em">${esc(p.given.pin)}</div>
    <div>Show ${esc(p.given.name)} this PIN now. It won't be shown again, and their old PIN no longer works.</div></div>`];
  if (p.page === "start" || p.page === "givepin") {
    if (p.person) return [`Start for ${p.person.name}`, `<div class="row">${back}</div>
      <div class="row grow"><button class="grow blue" data-act="istart" data-arg="out">Check out</button><button class="grow green" data-act="istart" data-arg="in">Return</button></div>`];
    return [p.page === "start" ? "Start for which student?" : "New PIN for who?", picker(back, "Type a name", p.results,
      x => `<button class="grow list-btn sm" data-act="iperson" data-arg="${esc(x.person_id)}"><span>${esc(x.name)}</span><span class="small muted">${esc(x.role)}</span></button>`)];
  }
  if (p.page === "loans") return ["Loans", `<div class="row">${back}<div class="grow" style="align-self:center">${msgBar("Tap to move a due time")}</div></div>
    <div class="col grow scroll">${(p.results || []).map(l => `<div class="row" style="align-items:center;border-bottom:2px solid var(--line);padding-bottom:8px">
      <div class="grow"><div class="n ${l.overdue ? "overdue" : ""}"><b>${esc(l.name)}</b>${l.overdue ? " · OVERDUE" : ""}</div>
      <div class="small muted">${esc(l.holder || "?")} · due ${l.due_at ? esc(time(l.due_at)) : "?"}</div></div>
      <button class="sm" data-act="iextend" data-arg="${esc(l.asset_id)}|1">+1 hour</button><button class="sm" data-act="iextend" data-arg="${esc(l.asset_id)}|24">+1 day</button></div>`).join("")
      || `<p class="muted">No tools are checked out.</p>`}</div>`];
  if (p.page === "photo") {
    if (p.tool) { const id = p.tool.asset_id, has = photos[id];
      return [`Photo · ${p.tool.name}`, `<div class="row">${back}</div><div class="row grow" style="align-items:center;gap:20px">
        ${has ? thumb(id, "width:220px;height:220px") : `<div class="card blue" style="width:220px;height:220px;display:flex;align-items:center;justify-content:center;text-align:center">No photo yet</div>`}
        <div class="col grow"><h2>Hold the ${esc(p.tool.name)} in front of the camera, label side out, against a plain background.</h2>
        <button class="green" data-act="isnap">📷 ${has ? "Retake photo" : "Take photo"}</button>
        <button class="blue" data-act="ilink">Link NFC sticker</button></div></div>`]; }
    return ["Which tool?", picker(back, "Type the tool's name or number", p.results,
      t => `<button class="grow list-btn sm" data-act="iptool" data-arg="${esc(t.asset_id)}"><span>${esc(t.name)}</span><span class="small muted">${photos[t.asset_id] ? "✓ photo" : esc(t.asset_id)}</span></button>`)];
  }
  if (p.page === "quarantine") {
    if (p.tool) return [`Release ${p.tool.name}`, `<div class="row">${back}<h2 class="grow" style="align-self:center">What did you check?</h2></div>
      ${NOTES.map(n => `<button class="grow" data-act="iclear" data-arg="${esc(n)}">${esc(n)}</button>`).join("")}`];
    return ["Locked tools", `<div class="row">${back}</div><div class="col grow scroll">${(p.results || []).map(t =>
      `<button class="list-btn sm" data-act="iqtool" data-arg="${esc(t.asset_id)}"><span>${esc(t.name)}</span><span class="small muted">${esc(t.asset_id)}</span></button>`).join("")
      || `<p class="muted">No tools are waiting for inspection.</p>`}</div>`];
  }
}

// Search box + up to 3 matches + on-screen keyboard. Only for instructor and report screens.
function picker(back, ph, results, item, extra = "") {
  const q = (ui.report?.step === "tool" ? ui.report : ui.inst).q || "";
  const keys = KEYS.map(k => `<button data-act="key" data-arg="${k}">${k}</button>`).join("")
    + `<button class="w2" data-act="key" data-arg=" ">space</button><button data-act="key" data-arg="⌫">⌫</button>`;
  return `<div class="row">${back}<div class="field" data-ph="${esc(ph)}">${esc(q)}</div>${extra}</div>
    ${item ? `<div class="row" style="min-height:64px">${(results || []).slice(0, 3).map(item).join("") || `<div class="muted small" style="align-self:center">No match</div>`}</div>` : ""}
    <div class="kb">${keys}</div>`;
}

// ---------- drawing ----------
function render() {
  const [title, body] = view();
  $("hlogo").hidden = title === null;  // the start screen already shows the big logo
  $("htitle").textContent = title ?? "Tool checkout";
  $("hlogo").src = logo;
  const html = body;
  if (html !== lastHtml) { $("main").innerHTML = html; lastHtml = html; }
  tick();
}
function tick() {
  $("clock").textContent = new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const s = st?.session, fill = $("fill");
  if (fill && s) {
    const left = Math.ceil(st.seconds_left ?? 0);
    fill.style.width = `${100 * left / st.idle_timeout}%`;
    fill.className = left <= 10 ? "low" : "";
    $("secs").textContent = left <= 15 ? `Saving in ${left} s. Scan or tap to keep going.` : `${left} s`;
  }
  if (ui.summary && $("sumleft")) $("sumleft").textContent = `· closes in ${Math.max(0, Math.ceil((ui.sumUntil - Date.now()) / 1000))} s`;
  if (ui.locked && $("lockleft")) {
    const ms = Math.max(0, new Date(ui.locked.until) - Date.now()), m = Math.floor(ms / 60000), sec = Math.floor(ms / 1000) % 60;
    $("lockleft").textContent = `${m}:${String(sec).padStart(2, "0")}`;
    if (Date.now() - ui.locked.at > 30000) { ui.locked = null; render(); }
  }
  if ((ui.report || ui.inst || ui.pad) && Date.now() - lastTap > 60000) { ui.report = ui.inst = ui.pad = null; ui.pin = ""; render(); }  // walked away
}
function showSummary(r) {
  ui.summary = r; ui.msg = null; flash("ok");
  const ms = r.action === "in" ? 25000 : 12000; ui.sumUntil = Date.now() + ms;
  clearTimeout(ui.sumTimer); ui.sumTimer = setTimeout(() => { ui.summary = null; render(); }, ms);
}

// ---------- buttons ----------
async function search() {
  const p = ui.report?.step === "tool" ? ui.report : ui.inst;
  if (!p || p.page === "asset") return;
  const q = encodeURIComponent((p.q || "").trim());
  if (ui.report || p.page === "photo") p.results = await call("GET", `/api/tools?q=${q}`);
  else if (p.page === "start" || p.page === "givepin") p.results = await call("GET", `/api/instructor/people?q=${q}`);
  else if (p.page === "loans") p.results = await call("GET", "/api/loans");
  else if (p.page === "quarantine") p.results = (await call("GET", "/api/tools")).filter(t => t.state === "quarantined");
  render();
}
const acts = {
  mode: a => go(() => call("POST", "/api/mode", {action: a}).then(() => { ui.msg = null; ui.pin = ""; ui.pad = a; })),
  pin: k => {
    if (k === "Cancel") { ui.pin = ""; ui.pad = null; return go(() => call("POST", "/api/mode", {action: "out"})); }
    if (k !== "✓") ui.pin = k === "⌫" ? ui.pin.slice(0, -1) : (ui.pin + k).slice(0, PIN_LEN);
    render();
    if (k === "✓" || ui.pin.length === PIN_LEN) { const pin = ui.pin; ui.pin = ""; go(() => call("POST", "/api/pin", {pin}).then(() => { ui.pad = null; })); }
  },
  qr: () => go(() => call("POST", "/api/qr")),
  remove: id => go(() => call("POST", "/api/session/remove", {asset_id: id}).then(() => say("Removed from your list"))),
  done: () => go(async () => {
    const r = await call("POST", "/api/session/finish");
    if (r.items.length) { ui.seenSaved = r.session_id; showSummary(r); } else say("Nothing was scanned, so nothing was saved.", "warn");
  }),
  cancel: () => {
    if (st.session.items.length && ui.cancelArm < Date.now()) { ui.cancelArm = Date.now() + 4000; render(); return setTimeout(render, 4100); }
    ui.cancelArm = 0; go(() => call("DELETE", "/api/session").then(() => say("Cancelled. Nothing was saved.", "warn")));
  },
  kitpiece: arg => { const [kit, id] = arg.split("|"); ui.kitMissing ??= {}; const m = ui.kitMissing[kit] ??= [];
    m.includes(id) ? m.splice(m.indexOf(id), 1) : m.push(id); render(); },
  kitok: kit => go(() => call("POST", "/api/session/kit", {kit_id: kit, missing: ui.kitMissing?.[kit] || []})
    .then(r => say(r.missing.length ? `Noted: ${r.missing.length} piece${r.missing.length === 1 ? "" : "s"} not back` : "All pieces back", r.missing.length ? "warn" : "ok"))),
  closesum: () => { ui.summary = null; render(); },
  closelock: () => { ui.locked = null; render(); },
  // report a problem
  report: () => { ui.report = {step: "type", tags: [], q: ""}; ui.inst = null; render(); },
  closereport: () => { ui.report = null; render(); },
  rback: () => { const r = ui.report; r.step = r.step === "detail" ? "tool" : "type"; render(); },
  rtype: k => { Object.assign(ui.report, {kind: k, step: "tool", q: ""}); render(); search(); },
  rtool: id => { const r = ui.report; r.tool = [...(st.session?.items || []), ...(r.results || [])].find(t => t.asset_id === id); r.step = "detail"; render(); },
  rsev: v => { ui.report.severity = v; render(); },
  rtag: g => { const t = ui.report.tags; t.includes(g) ? t.splice(t.indexOf(g), 1) : t.push(g); render(); },
  rlabel: c => sendReport("/api/label", {condition: c}),
  rsend: () => ui.report.kind === "spot" ? sendReport("/api/problem", {})
    : sendReport("/api/damage", {severity: ui.report.severity, tags: ui.report.tags}),
  // instructor
  logout: () => go(() => call("POST", "/api/instructor/logout")),
  asset: () => { ui.inst = {page: "asset", q: ""}; render(); },
  iptool: id => { ui.inst.tool = ui.inst.results.find(t => t.asset_id === id); render(); },
  isnap: () => go(() => call("POST", "/api/instructor/tool_photo", {asset_id: ui.inst.tool.asset_id})
    .then(r => { say(`Photo saved for ${r.name}`); return loadPhotos(); })),
  ipage: p => { ui.inst = {page: p, q: ""}; render(); search(); },
  ilink: () => go(() => call("POST", "/api/instructor/link_tag", {asset_id: ui.inst.tool.asset_id}).then(() => { ui.inst = null; })),
  iback: () => { const p = ui.inst; if (p.person || p.tool || p.given) { p.person = p.tool = p.given = null; render(); } else { ui.inst = null; render(); } },
  iperson: id => { const p = ui.inst, who = p.results.find(x => x.person_id === id);
    if (p.page === "givepin") go(() => call("POST", "/api/instructor/pin", {person_id: id}).then(r => { p.given = r; }));
    else { p.person = who; render(); } },
  istart: a => go(() => call("POST", "/api/instructor/start", {person_id: ui.inst.person.person_id, action: a}).then(() => { ui.inst = null; })),
  iasset: () => go(() => call("POST", "/api/instructor/manual", {asset_id: ui.inst.q.trim()}).then(() => { ui.inst = null; })),
  iextend: arg => { const [id, h] = arg.split("|"), l = ui.inst.results.find(x => x.asset_id === id);
    const from = Math.max(Date.now(), l.due_at ? new Date(l.due_at) : 0), due = new Date(from + h * 3600000).toISOString();
    go(() => call("POST", "/api/instructor/extend", {asset_id: id, due_at: due, reason: `Extended ${h === "1" ? "1 hour" : "1 day"} at the kiosk`})
      .then(r => { say(`${l.name} now due ${time(r.due_at)}`); return search(); })); },
  iqtool: id => { ui.inst.tool = ui.inst.results.find(t => t.asset_id === id); render(); },
  iclear: note => go(() => call("POST", "/api/instructor/clear", {asset_id: ui.inst.tool.asset_id, note})
    .then(() => { say(`${ui.inst.tool.name} can be checked out again`); ui.inst = {page: "quarantine", q: ""}; return search(); })),
  key: k => { const p = ui.report?.step === "tool" ? ui.report : ui.inst;
    p.q = k === "⌫" ? (p.q || "").slice(0, -1) : ((p.q || "") + k).slice(0, 30); render(); search(); },
};
function sendReport(url, extra) {
  const r = ui.report;
  go(() => call("POST", url, {asset_id: r.tool.asset_id, ...extra}).then(res => {
    ui.report = null;
    say(res.quarantined ? `Thanks. ${res.tool} is locked until an instructor checks it.` : `Thanks. Your report about ${res.tool} was sent.`);
  }));
}
document.addEventListener("click", e => {
  lastTap = Date.now();
  const b = e.target.closest("[data-act]");
  if (b && !b.disabled) acts[b.dataset.act]?.(b.dataset.arg);
});
document.addEventListener("contextmenu", e => e.preventDefault());  // long-press menus
document.addEventListener("pointerdown", () => { fetch("/api/wake", {method: "POST"}).catch(() => {}); });  // brightens a dimmed screen
poll(); setInterval(poll, 1000);
loadPhotos(); setInterval(loadPhotos, 60000);  // photos synced down from the Sheet show up within a minute
</script>
</body>
</html>
