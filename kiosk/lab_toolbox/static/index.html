<!doctype html>
<!-- Kiosk screen for the 7" touchscreen (800x480) in Chromium kiosk mode. One lean page, no libraries: it only talks to /api.
     Layout and look follow Ande's mockups and design notes (Nov 10 2026), fitted to 800x480: the mockups are 160 px taller,
     so the keypad sits beside its title and the receipt's check mark sits beside its heading.
     Logo: static/lab-mark.png (the toolbox from the Lab Toolbox logo, clear background) in the top bar, unless a static/logo.png override exists. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Toolbox</title>
<style>
/* Fonts and icons ship in static/fonts (SIL OFL and Apache 2.0), so the kiosk needs no internet for them. */
@font-face { font-family:"Hanken Grotesk"; src:url(/static/fonts/hanken-grotesk.woff2) format("woff2"); font-weight:100 900; }
@font-face { font-family:"JetBrains Mono"; src:url(/static/fonts/jetbrains-mono.woff2) format("woff2"); font-weight:100 800; }
@font-face { font-family:"Material Symbols"; src:url(/static/fonts/material-symbols.woff2) format("woff2"); }  /* only the icons this page uses */
/* Dark graphite look ("Apex Industrial Kiosk" notes): accents live on lamps, badges, icons and the one main button. */
:root { --bg:#121214; --tray:#1c1c1e; --well:#141416; --key:rgba(255,255,255,.08); --rim:rgba(255,255,255,.12);
        --text:#fff; --text2:rgba(235,235,245,.68); --text3:rgba(235,235,245,.42);
        --blue:#0a84ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a;                 /* fills, lamps, glows */
        --blue-t:#409cff; --green-t:#30d158; --amber-t:#ffb340; --red-t:#ff6961;         /* the same hues as text on dark */
        --on-green:#000; --shadow:0 8px 24px rgba(0,0,0,.4);
        --sans:"Hanken Grotesk", system-ui, "DejaVu Sans", sans-serif; --mono:"JetBrains Mono", "DejaVu Sans Mono", monospace; }
/* Light look ("Industrial Touch Precision" notes), picked by screen_theme on the dashboard's Settings page. */
:root[data-theme="light"] { --bg:#f5f5f7; --tray:#fff; --well:#f5f5f7; --key:#fff; --rim:#dcdce0;
        --text:#1d1d1f; --text2:#55555a; --text3:#86868b;
        --blue:#0071e3; --green:#28a745; --amber:#ff9500; --red:#e0352b;
        --blue-t:#0066cc; --green-t:#1f7a37; --amber-t:#a85400; --red-t:#c9241b;
        --on-green:#fff; --shadow:0 2px 10px rgba(0,0,0,.07); }
* { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
html, body { height:100%; background:var(--bg); color:var(--text); font:500 16px/1.35 var(--sans);
             overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; cursor:none; }
#app { position:fixed; inset:0; display:flex; flex-direction:column; }
/* color half of the feedback table: a rim glow around the whole screen (the Pi's buzzer is the sound half) */
#app::after { content:""; position:absolute; inset:0; pointer-events:none; border:5px solid transparent; transition:border-color .15s, box-shadow .15s; }
#app.f-ok::after { border-color:var(--green); box-shadow:inset 0 0 40px color-mix(in srgb, var(--green) 45%, transparent); }
#app.f-bad::after { border-color:var(--red); box-shadow:inset 0 0 40px color-mix(in srgb, var(--red) 45%, transparent); }
#app.f-warn::after { border-color:var(--amber); box-shadow:inset 0 0 40px color-mix(in srgb, var(--amber) 45%, transparent); }
#app.f-bad main { animation:shake .3s; }
@keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
.ms { font:normal 24px/1 "Material Symbols"; font-feature-settings:"liga"; white-space:nowrap; direction:ltr; flex:none; -webkit-font-smoothing:antialiased; }
.b { color:var(--blue-t); } .g { color:var(--green-t); } .a { color:var(--amber-t); } .r { color:var(--red-t); }
.mono { font-family:var(--mono); } .muted { color:var(--text2); }
h1 { font-size:30px; line-height:1.15; font-weight:800; letter-spacing:-.02em; }
h2 { font-size:22px; line-height:1.2; font-weight:700; letter-spacing:-.01em; }
.sub { font-size:15px; color:var(--text2); }
.lbl { font:600 11px/1.3 var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--text3); }
.row { display:flex; gap:12px; } .col { display:flex; flex-direction:column; gap:12px; } .grow { flex:1; min-width:0; } div.grow, section.grow { min-height:0; }
.center { align-items:center; } .scroll { overflow-y:auto; overscroll-behavior:contain; } .cut { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* top bar: station on the left, clock in the middle, one action on the right */
header { height:56px; flex:none; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 14px; border-bottom:1px solid var(--rim); }
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand .logo { width:42px; height:42px; flex:none; border-radius:12px; background:var(--tray); border:1px solid var(--rim); display:grid; place-items:center; }
.brand img { width:32px; height:32px; object-fit:contain; }
.brand .name { font-size:17px; font-weight:700; letter-spacing:-.01em; line-height:1.15; }
.lamp { display:flex; align-items:center; gap:6px; font:600 11px/1.3 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--green-t); white-space:nowrap; }
.lamp::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; }
.lamp.off { color:var(--red-t); } .lamp.inst { color:var(--amber-t); }
.clock { display:flex; align-items:center; gap:8px; height:38px; padding:0 16px; border-radius:19px; background:var(--tray); border:1px solid var(--rim);
         font:700 16px var(--mono); letter-spacing:.05em; font-variant-numeric:tabular-nums; }
.clock .ms { font-size:19px; color:var(--blue-t); }
#hact { justify-self:end; } #hact button { min-height:44px; border-radius:14px; font-size:14px; padding:0 14px; gap:8px; } #hact .ms { font-size:20px; }
main { flex:1; min-height:0; padding:12px 14px; display:flex; flex-direction:column; gap:12px; }

/* buttons: glass by default; one filled main action per screen */
button { font:600 16px/1.2 var(--sans); letter-spacing:-.005em; color:var(--text); background:var(--key); border:1px solid var(--rim); border-radius:16px;
         min-height:56px; min-width:56px; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:10px; text-align:center;
         transition:transform .08s, filter .08s, background .15s; }
button:active { transform:scale(.97); filter:brightness(1.15); }
button.lg { min-height:60px; border-radius:20px; font-size:18px; font-weight:700; }
button.blue { background:var(--blue); color:#fff; } button.green { background:var(--green); color:var(--on-green); }
button.red { background:var(--red); color:#fff; } button.amber { background:var(--amber); color:#000; }
button.blue, button.green, button.red, button.amber { border-color:transparent; }
button.blue { box-shadow:0 4px 18px color-mix(in srgb, var(--blue) 35%, transparent); } button.green { box-shadow:0 4px 18px color-mix(in srgb, var(--green) 35%, transparent); }
button:disabled { background:var(--key); color:var(--text3); box-shadow:none; border-color:var(--rim); }
button.sel { border-color:var(--blue); background:color-mix(in srgb, var(--blue) 18%, var(--tray)); box-shadow:0 0 0 1px var(--blue); }
button.sel.wa { border-color:var(--amber); background:color-mix(in srgb, var(--amber) 18%, var(--tray)); box-shadow:0 0 0 1px var(--amber); }
button.sel.wr { border-color:var(--red); background:color-mix(in srgb, var(--red) 18%, var(--tray)); box-shadow:0 0 0 1px var(--red); }
button.ghost { background:transparent; border-color:transparent; color:var(--text2); min-height:48px; min-width:48px; padding:0; }

/* surfaces */
.card { background:var(--tray); border:1px solid var(--rim); border-radius:16px; padding:12px; box-shadow:var(--shadow); }
.well { background:var(--well); border:1px solid var(--rim); border-radius:12px; padding:8px 12px; }
.pill { --c:var(--green-t); display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:13px; flex:none; white-space:nowrap;
        font:700 11px var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--c);
        background:color-mix(in srgb, var(--c) 14%, transparent); border:1px solid color-mix(in srgb, var(--c) 32%, transparent); }
.pill.dot::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--c); }
.pill.pb { --c:var(--blue-t); } .pill.pa { --c:var(--amber-t); } .pill.pr { --c:var(--red-t); }
.it { --c:var(--blue-t); width:44px; height:44px; flex:none; border-radius:12px; display:grid; place-items:center; color:var(--c); background:color-mix(in srgb, var(--c) 16%, transparent); }
.it.ig { --c:var(--green-t); } .it.ia { --c:var(--amber-t); } .it.ir { --c:var(--red-t); } .it.in { --c:var(--text2); }
.it.solid { background:var(--amber); color:#000; }
.av { width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--blue); color:#fff; font-size:12px; font-weight:800; }
.thumb { width:44px; height:44px; object-fit:cover; border-radius:10px; flex:none; background:#fff; }
.msg { --c:var(--blue-t); flex:none; min-height:48px; display:flex; align-items:center; gap:10px; padding:6px 14px; border-radius:14px; font-size:16px; font-weight:600;
       background:color-mix(in srgb, var(--c) 12%, var(--tray)); border:1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.msg .ms { color:var(--c); } .msg.ok { --c:var(--green-t); } .msg.bad { --c:var(--red-t); } .msg.warn { --c:var(--amber-t); }
.note { --c:var(--amber-t); border-radius:12px; padding:8px 12px; font-size:14px; background:color-mix(in srgb, var(--c) 12%, var(--tray)); border:1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.note.nb { --c:var(--blue-t); }

/* PIN keypad (the start screen) */
.pin { flex:1; display:flex; align-items:center; justify-content:center; gap:48px; min-height:0; }
.pin-l { width:372px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.seg { display:flex; gap:4px; padding:4px; width:100%; border-radius:20px; background:var(--well); border:1px solid var(--rim); margin-bottom:16px; }
.seg button { flex:1; border:0; background:transparent; color:var(--text2); border-radius:16px; }
.seg button.on { background:var(--blue); color:#fff; box-shadow:0 2px 10px color-mix(in srgb, var(--blue) 40%, transparent); }
.dots { display:flex; gap:20px; padding:13px 28px; margin:14px 0 10px; border-radius:30px; background:var(--well); border:1px solid var(--rim); }
.dots b { width:18px; height:18px; border-radius:50%; background:var(--key); border:1px solid var(--rim); transition:all .15s; }
.dots b.f { background:var(--blue); border-color:var(--blue); transform:scale(1.12); box-shadow:0 0 12px color-mix(in srgb, var(--blue) 70%, transparent); }
.fb { min-height:22px; font-size:14px; font-weight:600; color:var(--text3); margin-bottom:12px; }
.fb.bad { color:var(--red-t); } .fb.ok { color:var(--green-t); } .fb.warn { color:var(--amber-t); }
.pin-l > button { width:100%; }
.pad { display:grid; grid-template-columns:repeat(3, 76px); gap:12px 18px; }
.pad button { width:76px; height:76px; min-height:0; padding:0; border-radius:50%; font-size:28px; font-weight:700; box-shadow:var(--shadow); }
.pad button.del { background:transparent; color:var(--text2); box-shadow:none; }

/* tool scan screen: tool list on the left, NFC target on the right, actions along the bottom */
.split { flex:1; min-height:0; display:flex; gap:12px; }
.tools { width:300px; flex:none; display:flex; flex-direction:column; gap:8px; }
.ch { display:flex; align-items:center; gap:8px; font-weight:700; } .ch .ms { font-size:22px; } .ch b { flex:1; }
.list { flex:1; min-height:0; display:flex; flex-direction:column; gap:6px; }
.trow { display:flex; align-items:center; gap:10px; padding:5px 2px 5px 8px; min-height:58px; flex:none; }
.trow:first-child { animation:slide .35s ease-out; }
@keyframes slide { from { transform:translateX(-30px); opacity:0; } }
.trow .n { font-size:15px; font-weight:700; line-height:1.2; } .trow .d { font:500 11px var(--mono); color:var(--text3); }
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--text3); font-size:14px; }
.empty .ms { width:64px; height:64px; display:grid; place-items:center; font-size:30px; border-radius:50%; border:2px dashed var(--rim); }
.who { display:flex; align-items:center; gap:10px; flex:none; } .who b { font-size:14px; line-height:1.2; display:block; }
.nfc { --c:var(--blue); flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; overflow:hidden;
       background:radial-gradient(circle at 50% 62%, color-mix(in srgb, var(--c) 12%, transparent), transparent 60%), var(--tray); }
.nfc.ok { --c:var(--green); } .nfc.bad { --c:var(--red); } .nfc.warn { --c:var(--amber); }
.nfc.ok, .nfc.bad, .nfc.warn { border-color:var(--c); box-shadow:0 0 20px color-mix(in srgb, var(--c) 35%, transparent); }
.nfc h2 { margin-top:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.nfc .sub { margin-top:2px; font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.radar { position:relative; width:128px; height:128px; margin:auto; flex:none; display:grid; place-items:center; }
.radar i { position:absolute; inset:0; border-radius:50%; border:2px solid var(--c); opacity:0; animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
.radar i:nth-child(2) { animation-delay:.8s; } .radar i:nth-child(3) { animation-delay:1.6s; }
@keyframes ping { 0% { transform:scale(.8); opacity:.7; } 70%, 100% { transform:scale(1.45); opacity:0; } }
.core { position:relative; width:108px; height:108px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        background:var(--well); border:2px solid var(--c); box-shadow:0 0 30px color-mix(in srgb, var(--c) 40%, transparent); color:var(--text); }
.core .ms { font-size:44px; color:var(--c); } .core .lbl { color:var(--text); }
.nfc .foot { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
.nfc .foot::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--green); }
.nfc .foot.low { color:var(--amber-t); } .nfc .foot.low::before { background:var(--amber); }
.prog { position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--rim); }
.prog div { height:100%; background:var(--green); transition:width 1s linear; } .prog div.low { background:var(--amber); }
.kit { flex:1; min-height:0; width:100%; margin:8px 0; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:8px; overflow-y:auto; }
.kit button { min-height:52px; border-radius:26px; font-size:15px; }
.actions { flex:none; display:flex; gap:12px; }

/* receipt */
.sum { flex:1; min-height:0; width:100%; max-width:700px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
.hero { display:flex; align-items:center; justify-content:center; gap:16px; flex:none; text-align:left; }
.okb { width:50px; height:50px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--green); color:var(--on-green);
       box-shadow:0 0 0 8px color-mix(in srgb, var(--green) 20%, transparent), 0 0 24px color-mix(in srgb, var(--green) 45%, transparent); }
.okb .ms { font-size:32px; } .okb.rb { background:var(--red); color:#fff; box-shadow:0 0 0 8px color-mix(in srgb, var(--red) 20%, transparent), 0 0 24px color-mix(in srgb, var(--red) 45%, transparent); }
.rc { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.rrow { display:flex; align-items:center; gap:12px; flex:none; }
.rrow .v { font-size:16px; font-weight:700; line-height:1.2; } .rrow .loc { font:800 18px/1.2 var(--mono); color:var(--green-t); letter-spacing:.01em; }
.rrow.due { border:2px solid var(--amber); background:color-mix(in srgb, var(--amber) 12%, var(--tray)); } .rrow.due .lbl { color:var(--amber-t); } .rrow.due .v { font-family:var(--mono); font-weight:800; }
.rgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.chip { display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 14px 0 4px; border-radius:19px; background:var(--tray); border:1px solid var(--rim); font-size:13px; font-weight:600; flex:none; }
.chip .mono { font-size:11px; color:var(--text3); }
.lockc { margin:auto; width:460px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:18px; border-color:color-mix(in srgb, var(--red) 55%, transparent); }
.lockc .big { font:800 52px/1.1 var(--mono); color:var(--red-t); font-variant-numeric:tabular-nums; }

/* help, report and instructor pages */
.ph { display:flex; align-items:center; gap:12px; flex:none; }
.tiles { flex:1; min-height:0; display:grid; gap:12px; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; }
.tiles.c3 { grid-template-columns:1fr 1fr 1fr; } .tiles.c4 { grid-template-columns:repeat(4, 1fr); }
.tile { border-radius:16px; justify-content:flex-start; text-align:left; gap:14px; padding:12px 16px; font-size:17px; font-weight:700; box-shadow:var(--shadow); background:var(--tray); }
.tile small { display:block; font-size:13px; font-weight:500; color:var(--text2); margin-top:2px; }
.tile.v { flex-direction:column; justify-content:center; text-align:center; gap:10px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; } .chips button { border-radius:28px; font-size:15px; }
.bigpin { font:800 64px var(--mono); letter-spacing:.2em; padding:10px 28px 10px 40px; }
/* on-screen keyboard (instructor and report screens only; normal checkouts never type) */
.kb { display:grid; grid-template-columns:repeat(10, 1fr); gap:6px; flex:none; margin-top:auto; }
.kb button { min-height:54px; min-width:0; padding:0; font-size:19px; border-radius:12px; }
.kb .w2 { grid-column:span 2; font-size:14px; }
.field { flex:1; min-height:56px; display:flex; align-items:center; padding:0 16px; border:2px solid var(--blue); border-radius:14px; background:var(--well); font:600 20px var(--mono); letter-spacing:.04em; }
.field::after { content:""; width:3px; height:24px; margin-left:3px; border-radius:2px; background:var(--blue); animation:blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }
.field:empty::before { content:attr(data-ph); color:var(--text3); font:500 17px var(--sans); letter-spacing:0; }
.list-btn { justify-content:space-between; text-align:left; gap:10px; padding:0 14px; font-size:15px; } .list-btn .lbl { flex:none; }
.overdue { color:var(--red-t); }
@media (prefers-reduced-motion: reduce) { .radar i, .field::after { animation:none; } }
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><div class="logo"><img id="hlogo" alt=""></div><div><div class="name">Lab Toolbox</div><div class="lamp" id="net">Station online</div></div></div>
  <div class="clock"><span class="ms" aria-hidden="true">schedule</span><span id="clock"></span></div>
  <div id="hact"></div>
</header>
<main id="main"></main></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const ic = (name, cls = "") => `<span class="ms ${cls}" aria-hidden="true">${name}</span>`;  // a Material Symbols icon
const initials = name => String(name || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const clockNow = () => new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const time = iso => { const d = new Date(iso), today = d.toDateString() === new Date().toDateString();
  return (today ? "" : d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}) + ", ") + d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); };
const where = label => label ? label.toUpperCase().replace(/\s*,\s*/g, " • ") : "ASK AN INSTRUCTOR";
const KEYS = "1234567890QWERTYUIOPASDFGHJKL-ZXCVBNM".split("");
const TAGS = ["Cracked", "Broken part", "Won't power on", "Frayed cord", "Missing piece", "Dull or worn", "Leaking", "Bent"];
const PIN_LEN = 6;  // students have 4 digits and tap Start; staff have 6, which sends it straight away
const NOTES = ["Inspected, no damage", "Repaired", "Damage is cosmetic only"];

let photos = {};  // asset_id -> version, for tools with a photo on this Pi
const thumb = (id, style = "") => photos[id] ? `<img class="thumb" style="${style}" src="/api/tools/${encodeURIComponent(id)}/photo?v=${photos[id]}" alt="">` : "";
const loadPhotos = () => call("GET", "/api/photos").then(p => { photos = p; render(); }).catch(() => {});
let st = null, up = true, lastSeq = null, lastHtml = "", lastAct = "", flashTimer, lastTap = Date.now();
const ui = { pin: "", msg: null, summary: null, locked: null, report: null, inst: null, seenSaved: undefined, cancelArm: 0 };
// A logo.png dropped on the Pi (/data/logo.png) wins over the mark shipped in the repo.
$("hlogo").src = "/static/lab-mark.png";
const probe = new Image(); probe.onload = () => { $("hlogo").src = probe.src; }; probe.src = "/static/logo.png";

// ---------- talking to the kiosk service ----------
async function call(method, url, body) {
  const r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)});
  let data = {}; try { data = await r.json(); } catch {}
  if (!r.ok) { const e = {ok: false, kind: data.kind || "rejected", text: data.reason || "That didn't work. Try again.", ...data};
    feedback(e); throw e; }
  return data;
}
// Run a button's action; refusals are already on screen, so just refresh.
const go = fn => Promise.resolve().then(fn).catch(() => {}).finally(poll);

async function poll() {
  try { st = await call("GET", "/api/session"); net(true); }
  catch { net(false); return tick(); }
  const ev = st.last_event;
  document.documentElement.dataset.theme = st.theme;
  if (lastSeq === null) lastSeq = ev ? ev.seq : 0;  // don't replay an old scan after a reload
  else if (ev && ev.seq !== lastSeq) { lastSeq = ev.seq; feedback(ev); }
  const saved = st.auto_saved;  // the 45 s timer saved a walked-away session: still show its summary
  if (ui.seenSaved === undefined) ui.seenSaved = saved?.session_id ?? null;
  else if (saved && saved.session_id !== ui.seenSaved) { ui.seenSaved = saved.session_id; if (saved.items.length) showSummary(saved); }
  if (st.session) { ui.summary = null; ui.locked = null; }
  if (!st.session && !st.instructor) ui.inst = null;
  render(); tick();
}

const net = v => { up = v; };
function lamp() {  // the little status line under the name: service down beats instructor mode beats "online"
  const n = $("net");
  n.className = "lamp" + (!up ? " off" : st?.instructor ? " inst" : "");
  n.textContent = !up ? "Kiosk service down" : st?.instructor ? `Instructor · ${st.instructor}` : "Station online";
}

// ---------- feedback: color + words on screen; the Pi's buzzer plays the sound ----------
function feedback(ev) {
  const kind = ev.ok ? "ok" : ev.kind === "wrong_battery" ? "warn" : "bad";
  ui.msg = {kind, text: ev.text || ev.reason, ev, at: Date.now()};
  if (!ev.ok) ui.pin = "";
  if (ev.kind === "locked") ui.locked = {until: ev.until, text: ev.text || ev.reason, at: Date.now()};
  flash(kind);
}
function flash(kind) {
  const app = $("app"); app.className = ""; void app.offsetWidth; app.className = "f-" + kind;
  clearTimeout(flashTimer);
  if (kind !== "warn") flashTimer = setTimeout(() => app.className = "", kind === "bad" ? 1000 : 1200);
}
const say = (text, kind = "ok") => { ui.msg = {kind, text, at: Date.now()}; flash(kind); render(); };
const fresh = ms => ui.msg && Date.now() - ui.msg.at < ms ? ui.msg : null;
const MSG_ICON = {ok: "check", warn: "warning", bad: "close"};
const msgBar = hint => {
  const m = fresh(30000);
  if (!m) return `<div class="msg">${ic("support_agent")}<span>${esc(hint)}</span></div>`;
  return `<div class="msg ${m.kind}">${ic(MSG_ICON[m.kind])}<span>${esc(m.text)}</span></div>`;
};
const back = act => `<button data-act="${act}">${ic("arrow_back")}Back</button>`;

// ---------- screens: each returns [top-bar button, body] ----------
function view() {
  const s = st?.session;
  if (ui.locked) return lockedView();
  if (ui.summary) return summaryView();
  if (st?.next_action === "instructor" && !st.instructor) return pinView("instructor");
  if (ui.report) return reportView(s);
  if (ui.inst && st?.instructor) return instPage();
  if (s) return sessionView(s);
  if (st?.instructor) return instHome();
  return pinView(st?.next_action === "in" ? "in" : "out");
}

// The start screen is the keypad: pick Check out or Return, type a PIN, tap Start.
function pinView(mode) {
  const inst = mode === "instructor", m = fresh(8000);
  const n = inst ? 6 : Math.max(4, ui.pin.length);  // 4 dots, 6 once a staff PIN runs past 4
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"];
  return [inst ? "" : "help", `<div class="pin">
    <div class="pin-l">
      ${inst ? "" : `<div class="seg"><button class="${mode === "out" ? "on" : ""}" data-act="mode" data-arg="out">Check out</button>
        <button class="${mode === "in" ? "on" : ""}" data-act="mode" data-arg="in">Return</button></div>`}
      <h1>${inst ? "Instructor PIN" : mode === "in" ? "Enter PIN to return" : "Enter PIN to check out"}</h1>
      <p class="sub" style="margin-top:4px">${inst ? "Enter your 6-digit PIN" : "Type your PIN, then tap Start"}</p>
      <div class="dots">${[...Array(n).keys()].map(i => `<b class="${i < ui.pin.length ? "f" : ""}"></b>`).join("")}</div>
      <div class="fb ${m ? m.kind : ""}">${esc(m ? m.text : "Hide the keypad with your other hand")}</div>
      ${inst ? `<button class="lg" data-act="pin" data-arg="Cancel">${ic("close")}Cancel</button>`
        : `<button class="lg blue" data-act="pin" data-arg="✓" ${ui.pin.length < 4 ? "disabled" : ""}>${ic("lock_open")}${mode === "in" ? "Start return" : "Start checkout"}</button>`}
    </div>
    <div class="pad">${keys.map(k => k === "" ? "<span></span>" : k === "⌫" ? `<button class="del" aria-label="Delete" data-act="pin" data-arg="⌫">${ic("backspace")}</button>`
      : `<button data-act="pin" data-arg="${k}">${k}</button>`).join("")}</div>
  </div>`];
}

// What the big card on the scan screen says: fresh feedback first, then anything the session still needs, then the plain instruction.
function prompt(s) {
  const out = s.action === "out", m = fresh(6000), ev = m?.ev || {};
  if (ev.kind === "wrong_battery") return {tone: "warn", icon: "battery_alert", pill: "Wrong battery", title: "Wrong battery", sub: `Needs ${ev.required}. You tapped ${ev.scanned}.`};
  if (m) return {tone: m.kind, icon: MSG_ICON[m.kind], pill: m.kind === "ok" ? "Got it" : m.kind === "warn" ? "Heads up" : "Not added", title: m.text, sub: m.kind === "ok" ? "Tap the next tool, or tap Done." : ""};
  const need = s.items.find(i => i.needs_battery && !i.battery);
  if (need) { const opt = s.battery_options?.[need.asset_id] || {available: []};
    return {tone: "warn", icon: "battery_alert", pill: "Battery needed", title: `Now tap a ${opt.group || ""} battery`,
      sub: `${need.name} needs one. ` + (opt.available.length ? "Charged: " + opt.available.slice(0, 2).map(b => `${b.name} at ${b.spot || "?"}`).join(" · ") : "None free right now. Remove the tool or ask an instructor.")}; }
  const kit = (s.kits || []).find(k => out ? k.mode === "verified" && k.waiting.length : !k.confirmed);
  if (kit && out) return {tone: "", icon: "contactless", pill: "Kit", title: `Tap every piece of the ${kit.name}`, sub: `Still to tap: ${kit.waiting.map(p => p.name).join(", ")}`};
  if (kit) return {tone: "", icon: "contactless", pill: "Kit check", title: kit.name, kit,
    sub: kit.mode === "verified" ? "Tap each piece on the reader, then confirm." : "Tap any piece that is NOT back, then confirm."};
  if (st.qr) return {tone: "", icon: "qr_code_scanner", pill: "Step 2 of 3", title: "Hold the QR label up to the camera", sub: "The camera reads printed labels for one minute."};
  return {tone: "", icon: "contactless", pill: "Step 2 of 3", title: out ? "Tap each tool on the reader" : "Tap each tool you're returning", sub: "Hold the tool's NFC sticker flat against the reader."};
}

function sessionView(s) {
  const out = s.action === "out", items = [...s.items].reverse(), p = prompt(s), armed = ui.cancelArm > Date.now();
  const k = (s.kits || []).find(k => !out && !k.confirmed), miss = k && ui.kitMissing?.[k.kit_id] || [];
  const kitPanel = k && `<div class="kit">${k.waiting.map(x => k.mode === "verified" ? `<span class="pill pa">${esc(x.name)}</span>`
      : `<button class="${miss.includes(x.asset_id) ? "sel wr" : ""}" data-act="kitpiece" data-arg="${esc(k.kit_id)}|${esc(x.asset_id)}">${miss.includes(x.asset_id) ? ic("close", "r") + "Missing: " : ic("check", "g")}${esc(x.name)}</button>`).join("")}
    <button class="blue" data-act="kitok" data-arg="${esc(k.kit_id)}">Confirm pieces${k.mode === "verified" && k.waiting.length ? ` (${k.waiting.length} not back)` : ""}</button></div>`;
  return ["help", `<div class="split">
    <section class="card tools">
      <div class="ch">${ic("inventory_2", "b")}<b>${out ? "Tools to check out" : "Tools to return"}</b><span class="pill ${items.length ? "dot" : "pb"}">${plural(items.length, "tool")}</span></div>
      <div class="list scroll">${items.length ? items.map(i => `<div class="well trow">${thumb(i.asset_id) || `<div class="it in">${ic("build")}</div>`}
          <div class="grow"><div class="n cut">${esc(i.name)}</div>
          <div class="d cut">${esc(i.asset_id)}${i.kit_id ? " · KIT" : ""}${i.battery ? " · BATTERY " + esc(i.battery) : ""}${i.needs_battery && !i.battery ? ` · <span class="a">NEEDS BATTERY</span>` : ""}</div></div>
          <button class="ghost" aria-label="Remove ${esc(i.name)}" data-act="remove" data-arg="${esc(i.asset_id)}">${ic("close")}</button></div>`).join("")
        : `<div class="empty">${ic("build")}No tools yet</div>`}</div>
      <div class="well who"><span class="av">${esc(initials(s.person))}</span><div class="grow"><b class="cut">${esc(s.person)}</b>
        <span class="lbl">${out ? "Checking out" : "Returning"}${s.started_by ? ` · started by ${esc(s.started_by)}` : ""}</span></div></div>
    </section>
    <section class="card nfc ${p.tone}">
      <span class="pill ${p.tone === "ok" ? "" : p.tone === "bad" ? "pr" : p.tone === "warn" ? "pa" : "pb"}">${esc(p.pill)}</span>
      <h2>${esc(p.title)}</h2><p class="sub">${esc(p.sub)}</p>
      ${kitPanel || `<div class="radar">${p.tone ? "" : "<i></i><i></i><i></i>"}<div class="core">${ic(p.icon)}${p.icon === "contactless" ? `<span class="lbl">Tap here</span>` : ""}</div></div>`}
      <div class="lbl foot" id="foot">${st.qr ? "QR camera on" : "NFC reader active"} · <span id="secs"></span></div>
      <div class="prog"><div id="fill"></div></div>
    </section></div>
    <div class="actions">
      <button class="lg ${armed ? "red" : ""}" data-act="cancel">${ic("close")}${armed ? "Tap again to cancel" : "Cancel"}</button>
      ${st.qr ? "" : `<button class="lg" data-act="qr">${ic("qr_code_scanner", "b")}Scan QR code instead</button>`}
      ${st.instructor ? `<button class="lg" data-act="asset">${ic("keyboard", "b")}Type asset #</button>` : ""}
      <button class="lg green grow" data-act="done">${ic("check")}Done · ${plural(s.items.length, "tool")}</button>
    </div>`];
}

function summaryView() {
  const r = ui.summary, out = r.action === "out", n = r.items.length;
  const short = (r.kits_short || []).map(k => `<div class="note"><b>${esc(k.name)}</b> came back without ${esc(k.missing.join(", "))}. An instructor has been told.</div>`).join("");
  const rows = out
    ? `${r.due_at ? `<div class="well rrow due"><div class="it solid">${ic("timer")}</div><div class="grow"><div class="lbl">Return deadline</div><div class="v">${esc(time(r.due_at))}</div></div>
         <span class="pill pa">${plural(n, "tool")} out</span></div>` : ""}
       <div class="rgrid">${r.items.map(i => `<div class="well rrow">${thumb(i.asset_id) || `<div class="it in">${ic("build")}</div>`}<div class="grow"><div class="lbl">Tool issued</div>
         <div class="v cut">${esc(i.name)}</div><div class="lbl b" style="letter-spacing:.03em">${esc(i.asset_id)}</div></div></div>`).join("")}</div>`

      <span class="chip" style="margin-left:14px"><span class="av">${esc(initials(r.person))}</span>${esc(r.person)}<span class="mono">${esc(clockNow())}</span></span></div>

function lockedView() {
  return ["", `<div class="card lockc"><div class="okb rb">${ic("lock")}</div><h1>Keypad locked</h1><p class="sub">${esc(ui.locked.text)}</p>

// Need help? (K8, K14, K15): report a problem from any screen, or log in as an instructor. No typing when the tool is in your list.
function reportView(s) {
  const r = ui.report, b = back(r.step === "type" ? "closereport" : "rback");
  const tile = (act, arg, icon, tone, label, sub) => `<button class="tile" data-act="${act}" data-arg="${arg}"><div class="it ${tone}">${ic(icon)}</div><div>${label}<small>${sub}</small></div></button>`;
  if (r.step === "type") return ["", `<div class="ph">${b}<div><h2>Need help?</h2><p class="sub">Report a problem with a tool${st.instructor ? "" : ", or log in as an instructor"}.</p></div></div>
    <div class="tiles">${tile("rtype", "damage", "warning", "ir", "Damaged tool", "Cracked, broken or unsafe")}
      ${tile("rtype", "spot", "pin_drop", "ia", "Tool not in its spot", "Missing from where it belongs")}
      ${tile("rtype", "label", "sell", "in", "Worn or unreadable label", "Sticker or label needs replacing")}
      ${st.instructor ? "" : tile("mode", "instructor", "shield_person", "", "Instructor login", "Staff only, 6-digit PIN")}</div>`];
  if (r.step === "tool") {
    const mine = (s?.items || []).map(i => ({asset_id: i.asset_id, name: i.name}));
    return ["", picker(b, "Which tool? Type its name or number", mine.length && !r.q ? mine : r.results,
      t => `<button class="grow list-btn" data-act="rtool" data-arg="${esc(t.asset_id)}"><span class="cut">${esc(t.name)}</span><span class="lbl">${esc(t.asset_id)}</span></button>`)];
  }
  const t = esc(r.tool.name);
  if (r.kind === "label") return ["", `<div class="ph">${b}<div><h2>How does the label look?</h2><p class="sub">${t}</p></div></div>
    <div class="tiles c4">${["Faded", "Scratched", "Peeling", "Torn"].map(c => `<button class="tile v" data-act="rlabel" data-arg="${c}"><div class="it in">${ic("sell")}</div>${c}</button>`).join("")}</div>
    <p class="sub">It goes on the reprint list. You can keep using the tool.</p>`];
  if (r.kind === "spot") return ["", `<div class="ph">${b}<div><h2>Tool not in its spot</h2><p class="sub">${t}</p></div></div>
    <div class="card grow col center" style="justify-content:center;text-align:center"><div class="it ia">${ic("pin_drop")}</div>
      <h2>${t} isn't where it belongs.</h2><p class="sub">Send this to the instructors?</p></div>
    <button class="lg blue" data-act="rsend">${ic("flag")}Send report</button>`];
  const sev = [["minor", "Minor", ""], ["needs_inspection", "Needs inspection", "wa"], ["safety_hazard", "Safety hazard", "wr"]];
  return ["", `<div class="ph">${b}<div class="grow"><h2 class="cut">What's wrong with it?</h2><p class="sub cut">${t}</p></div></div>
    <div class="row">${sev.map(([v, l, c]) => `<button class="grow ${r.severity === v ? "sel " + c : ""}" data-act="rsev" data-arg="${v}">${l}</button>`).join("")}</div>
    <div class="chips">${TAGS.map(g => `<button class="${r.tags.includes(g) ? "sel" : ""}" data-act="rtag" data-arg="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div class="row center" style="margin-top:auto"><p class="sub grow">${r.severity && r.severity !== "minor" ? "The tool will be locked until an instructor checks it. " : ""}Hold the damage up to the camera, then tap Send.</p>
    <button class="lg red" style="min-width:220px" data-act="rsend" ${r.severity ? "" : "disabled"}>${ic("photo_camera")}Send report</button></div>`];
}

// Instructor mode (K7, K14, K16, K17)
function instHome() {

  return ["help", `${st.link_for ? `<div class="msg">${ic("nfc")}<span>Tap the new sticker for the ${esc(st.link_for)} on the reader now.</span></div>` : msgBar("Instructor mode. Pick a job.")}
    <div class="tiles c3">${tile("ipage", "start", "person", "", "Start for a student", "Forgot their PIN")}
      ${tile("ipage", "givepin", "key", "", "Give a PIN", "New or forgotten PIN")}
      ${tile("ipage", "photo", "photo_camera", "", "Tool photos &amp; stickers", "Photo or NFC sticker")}
      ${tile("ipage", "loans", "history", "", "Loans &amp; due times", "Move a due time")}
      ${tile("ipage", "quarantine", "lock_open", "ia", "Release a locked tool", "After you inspect it")}
      ${tile("logout", "", "logout", "ir", "Log out", "End instructor mode")}</div>`];
}

function instPage() {
  const p = ui.inst, b = back("iback");
  if (p.page === "asset") return ["", picker(b, "Engraved asset number, like HHA-0001", null, null,
    `<button class="green" data-act="iasset">${ic("add")}Add</button>`)];
  if (p.page === "givepin" && p.given) return ["", `<div class="ph">${b}<div><h2>New PIN for ${esc(p.given.name)}</h2><p class="sub">Show them this PIN now. It won't be shown again, and their old PIN no longer works.</p></div></div>
    <div class="grow col center" style="justify-content:center"><div class="well bigpin">${esc(p.given.pin)}</div></div>`];
  if (p.page === "start" || p.page === "givepin") {

      <div class="tiles"><button class="tile v" data-act="istart" data-arg="out"><div class="it">${ic("build")}</div>Check out</button>
        <button class="tile v" data-act="istart" data-arg="in"><div class="it ig">${ic("pin_drop")}</div>Return</button></div>`];
    return ["", picker(b, p.page === "start" ? "Start for which student? Type a name" : "New PIN for who? Type a name", p.results,

  }
  if (p.page === "loans") return ["", `<div class="ph">${b}<div class="grow">${msgBar("Loans. Tap +1 hour or +1 day to move a due time.")}</div></div>
    <div class="col grow scroll" style="gap:8px">${(p.results || []).map(l => `<div class="well rrow">

      <div class="lbl">${esc(l.holder || "?")} · due ${l.due_at ? esc(time(l.due_at)) : "?"}</div></div>

      return ["", `<div class="ph">${b}<div class="grow"><h2 class="cut">${esc(p.tool.name)}</h2><p class="sub">Hold it in front of the camera, label side out, against a plain background.</p></div></div>
        <div class="row grow center" style="gap:16px">

        <div class="col grow"><button class="lg blue" data-act="isnap">${ic("photo_camera")}${has ? "Retake photo" : "Take photo"}</button>

    return ["", picker(b, "Which tool? Type its name or number", p.results,

    return ["", `<div class="ph">${b}<div><h2>Locked tools</h2><p class="sub">Tap a tool after you have inspected it.</p></div></div>
      <div class="col grow scroll" style="gap:8px">${(p.results || []).map(t =>
      `<button class="list-btn" data-act="iqtool" data-arg="${esc(t.asset_id)}"><span class="cut">${esc(t.name)}</span><span class="lbl">${esc(t.asset_id)}</span></button>`).join("")
      || `<div class="empty">${ic("check")}No tools are waiting for inspection.</div>`}</div>`];
  }
}

// Search box + up to 3 matches + on-screen keyboard. Only for instructor and report screens.
function picker(b, ph, results, item, extra = "") {
  const q = (ui.report?.step === "tool" ? ui.report : ui.inst).q || "";
  const keys = KEYS.map(k => `<button data-act="key" data-arg="${k}">${k}</button>`).join("")
    + `<button class="w2" data-act="key" data-arg=" ">space</button><button aria-label="Delete" data-act="key" data-arg="⌫">${ic("backspace")}</button>`;
  return `<div class="row">${b}<div class="field" data-ph="${esc(ph)}">${esc(q)}</div>${extra}</div>
    ${item ? `<div class="row" style="min-height:56px">${(results || []).slice(0, 3).map(item).join("") || `<p class="sub" style="align-self:center">No match</p>`}</div>` : ""}
    <div class="kb">${keys}</div>`;
}

// ---------- drawing ----------
const HDR = {help: `<button data-act="report">${ic("support_agent", "b")}Need help?</button>`, "": ""};
function render() {
  const [act, body] = view();
  if (act !== lastAct) { $("hact").innerHTML = HDR[act]; lastAct = act; }
  if (body !== lastHtml) { $("main").innerHTML = body; lastHtml = body; }
  tick();
}
function tick() {
  $("clock").textContent = clockNow();
  lamp();
  const s = st?.session, fill = $("fill");
  if (fill && s) {
    const left = Math.ceil(st.seconds_left ?? 0), low = left <= 15;
    fill.style.width = `${100 * left / st.idle_timeout}%`;
    fill.className = low ? "low" : ""; $("foot").classList.toggle("low", low);
    $("secs").textContent = low ? `saving in ${left} s · tap to keep going` : `saves in ${left} s`;
  }
  if (ui.summary && $("sumleft")) $("sumleft").textContent = `· closes in ${Math.max(0, Math.ceil((ui.sumUntil - Date.now()) / 1000))} s`;
  if (ui.locked && $("lockleft")) {
    const ms = Math.max(0, new Date(ui.locked.until) - Date.now()), m = Math.floor(ms / 60000), sec = Math.floor(ms / 1000) % 60;
    $("lockleft").textContent = `${m}:${String(sec).padStart(2, "0")}`;
    if (Date.now() - ui.locked.at > 30000) { ui.locked = null; render(); }
  }
  if (Date.now() - lastTap > 60000 && (ui.report || ui.inst || ui.pin || st?.next_action === "instructor" && !st.instructor)) {  // walked away
    if (st?.next_action === "instructor" && !st.instructor) call("POST", "/api/mode", {action: "out"}).catch(() => {});
    ui.report = ui.inst = null; ui.pin = ""; render();
  }
}
function showSummary(r) {
  ui.summary = r; ui.msg = null; flash("ok");
  const ms = r.action === "in" ? 25000 : 12000; ui.sumUntil = Date.now() + ms;
  clearTimeout(ui.sumTimer); ui.sumTimer = setTimeout(() => { ui.summary = null; render(); }, ms);
}

// ---------- buttons ----------
async function search() {
  const p = ui.report?.step === "tool" ? ui.report : ui.inst;
  if (!p || p.page === "asset") return;
  const q = encodeURIComponent((p.q || "").trim());
  if (ui.report || p.page === "photo") p.results = await call("GET", `/api/tools?q=${q}`);
  else if (p.page === "start" || p.page === "givepin") p.results = await call("GET", `/api/instructor/people?q=${q}`);
  else if (p.page === "loans") p.results = await call("GET", "/api/loans");
  else if (p.page === "quarantine") p.results = (await call("GET", "/api/tools")).filter(t => t.state === "quarantined");
  render();
}
const acts = {
  mode: a => go(() => call("POST", "/api/mode", {action: a}).then(() => { ui.msg = null; ui.pin = ""; ui.report = null; })),
  pin: k => {
    if (k === "Cancel") { ui.pin = ""; return go(() => call("POST", "/api/mode", {action: "out"})); }
    if (k === "✓" && ui.pin.length < 4) return;
    if (k !== "✓") ui.pin = k === "⌫" ? ui.pin.slice(0, -1) : (ui.pin + k).slice(0, PIN_LEN);
    render();
    if (k === "✓" || ui.pin.length === PIN_LEN) { const pin = ui.pin; ui.pin = ""; go(() => call("POST", "/api/pin", {pin})); }
  },
  qr: () => go(() => call("POST", "/api/qr").then(() => say("Hold the tool's QR label up to the camera"))),
  remove: id => go(() => call("POST", "/api/session/remove", {asset_id: id}).then(() => say("Removed from your list"))),
  done: () => go(async () => {
    const r = await call("POST", "/api/session/finish");
    if (r.items.length) { ui.seenSaved = r.session_id; showSummary(r); } else say("Nothing was scanned, so nothing was saved.", "warn");
  }),
  cancel: () => {
    if (st.session.items.length && ui.cancelArm < Date.now()) { ui.cancelArm = Date.now() + 4000; render(); return setTimeout(render, 4100); }
    ui.cancelArm = 0; go(() => call("DELETE", "/api/session").then(() => say("Cancelled. Nothing was saved.", "warn")));
  },
  kitpiece: arg => { const [kit, id] = arg.split("|"); ui.kitMissing ??= {}; const m = ui.kitMissing[kit] ??= [];
    m.includes(id) ? m.splice(m.indexOf(id), 1) : m.push(id); render(); },
  kitok: kit => go(() => call("POST", "/api/session/kit", {kit_id: kit, missing: ui.kitMissing?.[kit] || []})
    .then(r => say(r.missing.length ? `Noted: ${r.missing.length} piece${r.missing.length === 1 ? "" : "s"} not back` : "All pieces back", r.missing.length ? "warn" : "ok"))),
  closesum: () => { ui.summary = null; render(); },
  closelock: () => { ui.locked = null; render(); },
  // report a problem
  report: () => { ui.report = {step: "type", tags: [], q: ""}; ui.inst = null; render(); },
  closereport: () => { ui.report = null; render(); },
  rback: () => { const r = ui.report; r.step = r.step === "detail" ? "tool" : "type"; render(); },
  rtype: k => { Object.assign(ui.report, {kind: k, step: "tool", q: ""}); render(); search(); },
  rtool: id => { const r = ui.report; r.tool = [...(st.session?.items || []), ...(r.results || [])].find(t => t.asset_id === id); r.step = "detail"; render(); },
  rsev: v => { ui.report.severity = v; render(); },
  rtag: g => { const t = ui.report.tags; t.includes(g) ? t.splice(t.indexOf(g), 1) : t.push(g); render(); },
  rlabel: c => sendReport("/api/label", {condition: c}),
  rsend: () => ui.report.kind === "spot" ? sendReport("/api/problem", {})
    : sendReport("/api/damage", {severity: ui.report.severity, tags: ui.report.tags}),
  // instructor
  logout: () => go(() => call("POST", "/api/instructor/logout")),
  asset: () => { ui.inst = {page: "asset", q: ""}; render(); },
  iptool: id => { ui.inst.tool = ui.inst.results.find(t => t.asset_id === id); render(); },
  isnap: () => go(() => call("POST", "/api/instructor/tool_photo", {asset_id: ui.inst.tool.asset_id})
    .then(r => { say(`Photo saved for ${r.name}`); return loadPhotos(); })),
  ipage: p => { ui.inst = {page: p, q: ""}; render(); search(); },
  ilink: () => go(() => call("POST", "/api/instructor/link_tag", {asset_id: ui.inst.tool.asset_id}).then(() => { ui.inst = null; })),
  iback: () => { const p = ui.inst; if (p.person || p.tool || p.given) { p.person = p.tool = p.given = null; render(); } else { ui.inst = null; render(); } },
  iperson: id => { const p = ui.inst, who = p.results.find(x => x.person_id === id);
    if (p.page === "givepin") go(() => call("POST", "/api/instructor/pin", {person_id: id}).then(r => { p.given = r; }));
    else { p.person = who; render(); } },
  istart: a => go(() => call("POST", "/api/instructor/start", {person_id: ui.inst.person.person_id, action: a}).then(() => { ui.inst = null; })),
  iasset: () => go(() => call("POST", "/api/instructor/manual", {asset_id: ui.inst.q.trim()}).then(() => { ui.inst = null; })),
  iextend: arg => { const [id, h] = arg.split("|"), l = ui.inst.results.find(x => x.asset_id === id);
    const from = Math.max(Date.now(), l.due_at ? new Date(l.due_at) : 0), due = new Date(from + h * 3600000).toISOString();
    go(() => call("POST", "/api/instructor/extend", {asset_id: id, due_at: due, reason: `Extended ${h === "1" ? "1 hour" : "1 day"} at the kiosk`})
      .then(r => { say(`${l.name} now due ${time(r.due_at)}`); return search(); })); },
  iqtool: id => { ui.inst.tool = ui.inst.results.find(t => t.asset_id === id); render(); },
  iclear: note => go(() => call("POST", "/api/instructor/clear", {asset_id: ui.inst.tool.asset_id, note})
    .then(() => { say(`${ui.inst.tool.name} can be checked out again`); ui.inst = {page: "quarantine", q: ""}; return search(); })),
  key: k => { const p = ui.report?.step === "tool" ? ui.report : ui.inst;
    p.q = k === "⌫" ? (p.q || "").slice(0, -1) : ((p.q || "") + k).slice(0, 30); render(); search(); },
};
function sendReport(url, extra) {
  const r = ui.report;
  go(() => call("POST", url, {asset_id: r.tool.asset_id, ...extra}).then(res => {
    ui.report = null;
    say(res.quarantined ? `Thanks. ${res.tool} is locked until an instructor checks it.` : `Thanks. Your report about ${res.tool} was sent.`);
  }));
}
document.addEventListener("click", e => {
  lastTap = Date.now();
  const b = e.target.closest("[data-act]");
  if (b && !b.disabled) acts[b.dataset.act]?.(b.dataset.arg);
});
document.addEventListener("contextmenu", e => e.preventDefault());  // long-press menus
document.addEventListener("pointerdown", () => { fetch("/api/wake", {method: "POST"}).catch(() => {}); });  // brightens a dimmed screen
poll(); setInterval(poll, 1000);
loadPhotos(); setInterval(loadPhotos, 60000);  // photos synced down from the Sheet show up within a minute
</script>
</body>
